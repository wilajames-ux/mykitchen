<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.plate{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff6e8 0 58%,#f0d9b0 59% 64%,#fff6e8 65%);display:grid;place-items:center;font-size:7rem;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;text-align:left}
.card .em{font-size:2.2rem}.card .open{all:unset;display:block;cursor:pointer;width:100%}.card .open:focus-visible{outline:3px solid var(--sage);outline-offset:4px}.card .sm{padding:6px 14px;font-size:.9rem;margin-top:10px}.ing{columns:2 220px;padding-left:20px;margin:6px 0 10px}.sub{font-family:var(--fh);font-weight:var(--hw);font-size:1.1rem;margin:16px 0 0;color:var(--berry)}.mv{display:flex;flex-direction:column;gap:4px}.mv button{background:var(--card);border:1px solid var(--line);border-radius:8px;width:36px;height:30px;cursor:pointer}.mv button:disabled{opacity:.3;cursor:default}.step{display:grid;grid-template-columns:80px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}.step .tm{font-weight:800;color:var(--berry)}.step .who{font-weight:800}.note{color:var(--soft);font-size:.92rem}.card.blank{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:2px dashed var(--line);background:transparent;color:var(--soft);font-weight:800;text-align:center}.card.blank .plus{font-size:2.4rem;line-height:1;color:var(--berry)}.card.blank:hover{border-color:var(--berry)}
.hint{color:var(--soft);font-size:.9rem;margin:0 0 6px}
.row:empty{display:none}
.step>details{min-width:0}.step summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px}.step summary::-webkit-details-marker{display:none}.step summary .who::before{content:'▸ ';color:var(--soft)}.step details[open] summary .who::before{content:'▾ '}.pv{color:var(--soft);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%}.step details[open] .pv{display:none}.sbody{margin-top:6px}
.list input.gi{flex:1;width:auto;height:auto;min-width:0;border:1px solid transparent;background:transparent;padding:4px 8px;border-radius:8px;font-size:1rem}.list input.gi:hover,.list input.gi:focus{border-color:var(--line);background:var(--card)}.list li.done input.gi{text-decoration:line-through;color:var(--soft)}.gm{width:auto;max-width:150px;font-size:.85rem;padding:5px 8px;border-radius:var(--rp);color:var(--soft)}@media(max-width:640px){.list li{flex-wrap:wrap}.list input.gi{flex-basis:calc(100% - 40px)}.gm{margin-left:34px}}
.card{position:relative;user-select:none;-webkit-user-select:none}.grip{position:absolute;top:8px;right:8px;cursor:grab;touch-action:none;color:var(--soft);font-size:1.3rem;line-height:1;padding:4px 6px}.card.placeholder{opacity:.35;border-style:dashed}.card.ghost{position:fixed;z-index:60;pointer-events:none;opacity:.92;box-shadow:0 14px 30px rgba(0,0,0,.35);transform:rotate(2deg)}
.fpanel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}.fl{font-weight:800;margin:8px 0 6px}.fc{border:1px solid var(--line);background:transparent;border-radius:var(--rp);padding:5px 14px;cursor:pointer;text-transform:capitalize}.fc[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.stp{display:inline-flex;gap:8px;align-items:center;font-family:var(--fb);font-size:.95rem;color:var(--ink)}.sub .stp{margin-left:12px}.stp button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:800;color:var(--ink)}.stp .rs{width:auto;padding:0 12px;border-radius:var(--rp);font-weight:600}
.btn.sm{padding:6px 14px;font-size:.9rem}.mwrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px;align-items:start}.tpanel{position:sticky;top:12px}.tform,.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}.tcard{margin-top:12px}.tn{font-weight:800}.tt{font-family:var(--fh);font-size:2.3rem;line-height:1.1;margin:4px 0 10px;font-variant-numeric:tabular-nums}.tcard.ring{background:var(--berry);color:var(--on-berry);border-color:var(--berry)}.tcard.ring .btn.alt{color:var(--on-berry)}#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--berry);color:var(--on-berry);padding:12px 22px;border-radius:var(--rp);font-weight:800;cursor:pointer;z-index:50}#toast[hidden]{display:none}@media(max-width:820px){.mwrap{grid-template-columns:1fr}.tpanel{position:static;order:-1}}
.card h3{font-size:1.1rem;margin:4px 0}
.card small{color:var(--soft)}
section{margin-top:30px}
h2{font-size:1.6rem;margin-bottom:6px}
input,textarea,select{width:100%;padding:10px 12px;border-radius:var(--ri);border:1px solid var(--line);background:var(--card)}
label{display:block;font-weight:600;margin:14px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
dialog{max-width:560px;width:calc(100% - 28px);border:0;border-radius:var(--rh);background:var(--card);color:var(--ink);padding:26px;max-height:88vh}

dialog ul,dialog ol{padding-left:22px}
.list{list-style:none;padding:0;margin:14px 0}
.list li{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line)}
.list input{width:22px;height:22px;accent-color:var(--sage)}
.list li.done span{text-decoration:line-through;color:var(--soft)}
.chip{display:inline-block;background:var(--sage);color:#fff;border-radius:var(--rp);padding:2px 12px;font-size:.85rem;font-weight:700}
.empty{color:var(--soft);padding:20px 0}
@media(max-width:640px){.hero{grid-template-columns:1fr;padding:24px}.plate{width:150px;font-size:4.5rem;order:-1}.two{grid-template-columns:1fr}}


.po{display:none}
@media print{
 :root{--bg:#fff;--card:#fff;--ink:#000;--soft:#444;--line:#bbb;--berry:#000;--sage:#000}
 body{background:#fff;color:#000;font-size:12pt}
 main{max-width:none;padding:0}
 nav,.tpanel,#toast,.mv,.grip,.btn,button,select,.hint,[data-sall],.card.blank,#stylesel,.pv,.sub .stp,.stp{display:none!important}
 .po{display:block;color:#444;margin:0 0 12px}
 .mwrap{display:block}
 .step{break-inside:avoid;grid-template-columns:70px 1fr}
 .step summary{list-style:none}.step summary .who::before{content:''!important}
 .list input.gi{border:0!important;background:none!important;color:#000!important;padding:2px 4px}
 .list li{break-inside:avoid}
 h2,h3,.sub{break-after:avoid;color:#000}
}
</style>
</head>
<body>
<main>
<nav>
  <span class="logo">Our Kitchen Table</span>
  <button class="tab" data-v="today">Today</button>
  <button class="tab" data-v="recipes">Recipes</button>
  <button class="tab" data-v="menu">Menu</button>
  <button class="tab" data-v="groc">Grocery list</button>
  <select id="stylesel" aria-label="Design style"><option value="cozy">Cozy Kitchen</option><option value="rustic">Rustic Farmhouse</option><option value="garden">Fresh Garden</option></select>
</nav>
<div id="app"></div>
</main>
<dialog id="dlg"></dialog>
<div id="toast" role="status" hidden></div>

<script>
const SEED=[
{id:'s1',em:'🍝',title:'Sunday Tomato Basil Pasta',mins:30,serves:4,tag:'dinner',ing:['400 g spaghetti','2 cloves garlic','1 can crushed tomatoes','2 tbsp olive oil','1 handful fresh basil','50 g parmesan'],steps:['Boil the pasta in well-salted water until just tender.','Warm the olive oil and soften the garlic for a minute.','Add the tomatoes and simmer 15 minutes.','Toss with pasta, torn basil and parmesan.']},
{id:'s2',em:'🥞',title:'Fluffy Buttermilk Pancakes',mins:25,serves:4,tag:'breakfast',ing:['2 cup flour','2 tbsp sugar','2 tsp baking powder','2 cup buttermilk','2 eggs','3 tbsp butter'],steps:['Whisk the dry ingredients together.','Mix in buttermilk, eggs and melted butter until just combined.','Cook spoonfuls on a buttered pan until bubbles form, then flip.','Stack and serve with maple syrup.']},
{id:'s3',em:'🍲',title:'Chicken Noodle Soup',mins:50,serves:6,tag:'dinner',ing:['500 g chicken thighs','2 carrots','2 stalks celery','1 onion','200 g egg noodles','1.5 l chicken stock','2 cloves garlic'],steps:['Sauté chopped onion, carrot, celery and garlic.','Add stock and chicken; simmer 25 minutes.','Shred the chicken and return it to the pot.','Add noodles and cook until tender.']},
{id:'s4',em:'🍪',title:'Brown Butter Chocolate Chip Cookies',mins:40,serves:12,tag:'dessert',ing:['170 g butter','1.5 cup flour','1 cup brown sugar','1 egg','1 tsp vanilla','200 g chocolate chips','1 tsp baking soda'],steps:['Brown the butter and let it cool.','Beat in sugar, egg and vanilla.','Fold in flour, soda and chocolate.','Bake at 180°C for 11 minutes.']},
{id:'s5',em:'🥣',title:'Creamy Oatmeal with Baked Apples',mins:20,serves:2,tag:'breakfast',ing:['1 cup rolled oats','2 cup milk','2 apples','1 tbsp honey','1 tsp cinnamon','1 pinch salt'],steps:['Simmer oats in milk with the salt for 8 minutes.','Cook sliced apples with cinnamon and honey.','Spoon apples over the oatmeal.']},
{id:'s6',em:'🍅',title:'Grilled Cheese & Tomato Soup',mins:35,serves:3,tag:'lunch',ing:['1 can crushed tomatoes','1 onion','2 cup stock','6 slices bread','150 g cheddar','2 tbsp butter'],steps:['Soften onion, add tomatoes and stock, simmer 15 minutes, then blend.','Butter the bread, fill with cheddar.','Toast until golden on both sides.','Dunk generously.']}
];
const $=s=>document.querySelector(s);
let S={mine:[],plan:[],checked:{},shuffle:0,view:'today',q:''};
try{const r=localStorage.getItem('cookbook-v1');if(r)Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('cookbook-v1',JSON.stringify(S))}catch(e){}};
const all=()=>[...SEED.filter(r=>!(S.hidden||[]).includes(r.id)).map(r=>(S.ov&&S.ov[r.id])||r),...S.mine];
const byId=id=>all().find(r=>r.id===id);
const ordered=()=>{const o=S.rorder||[];return all().slice().sort((a,b)=>{const i=o.indexOf(a.id),j=o.indexOf(b.id);return (i<0?1e6:i)-(j<0?1e6:j)})};
const MEALS=['breakfast','lunch','dinner','dessert','snack'],TIMES=[[20,'Under 20 min'],[30,'Under 30 min'],[45,'Under 45 min'],[60,'Under 1 hour']];
const sv=r=>(S.sv&&S.sv[r.id])||r.serves,fac=r=>sv(r)/r.serves;
const nice=q=>{const F=[[0,''],[.25,'1/4'],[1/3,'1/3'],[.5,'1/2'],[2/3,'2/3'],[.75,'3/4'],[1,'']];let w=Math.floor(q),r=q-w;const b=F.reduce((a,x)=>Math.abs(x[0]-r)<Math.abs(a[0]-r)?x:a);if(Math.abs(b[0]-r)>.07)return String(Math.round(q*100)/100);if(b[0]===1)w+=1;return [w||'',b[1]].filter(x=>x!=='').join(' ')||'0'};
const scaleLine=(l,f)=>{const m=norm(l.trim()).match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)\s*(.*)$/);if(!m||f===1)return l;const q=m[1].split(/\s+/).reduce((a,x)=>a+(x.includes('/')?x.split('/')[0]/x.split('/')[1]:+x),0)*f;return nice(q)+' '+m[2]};
const stp=r=>`<span class="stp">Servings<button data-sv="${r.id},-1" aria-label="Fewer servings">−</button><b>${sv(r)}</b><button data-sv="${r.id},1" aria-label="More servings">+</button>${sv(r)!==r.serves?`<button class="rs" data-sv="${r.id},0">Reset</button>`:''}</span>`;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const meal=()=>{const h=new Date().getHours();return h<11?'breakfast':h<15?'lunch':h<21?'dinner':'dessert'};
const MEAL={breakfast:"Good morning, start the day with",lunch:"A good pick for lunch",dinner:"Tonight's dinner pick",dessert:"Something sweet for the evening"};
function today(){const m=meal(),p=all().filter(r=>r.tag===m||(m==='dessert'&&r.tag==='snack')),l=p.length?p:all(),d=new Date(),k=d.getFullYear()*400+d.getMonth()*31+d.getDate()+S.shuffle;return l[k%l.length]}
const UNITS=['cup','tbsp','tsp','g','kg','oz','lb','ml','l','clove','can','slice','stalk','pinch','dash','handful','bunch','piece','tablespoon','teaspoon','ounce','pound','gram','kilogram','milliliter','liter'];
const PLU=['cup','clove','can','slice','stalk','pinch','dash','handful','bunch','piece'];
const UCAN={tablespoon:'tbsp',teaspoon:'tsp',ounce:'oz',pound:'lb',gram:'g',kilogram:'kg',milliliter:'ml',liter:'l'};
const FR={'½':'1/2','¼':'1/4','¾':'3/4','⅓':'1/3','⅔':'2/3','⅛':'1/8','⅜':'3/8','⅝':'5/8','⅞':'7/8'};
const norm=s=>s.replace(/(\d)\s*([½¼¾⅓⅔⅛⅜⅝⅞])/g,(m,d,f)=>d+' '+FR[f]).replace(/[½¼¾⅓⅔⅛⅜⅝⅞]/g,f=>FR[f]).replace(/\b(tbsp|tsp|oz|lb)s?\./gi,'$1');
const sing=w=>/ies$/.test(w)?w.slice(0,-3)+'y':/oes$/.test(w)?w.slice(0,-2):/(ch|sh|x|ss|z)es$/.test(w)?w.slice(0,-2):/(us|ss)$/.test(w)||!/s$/.test(w)?w:w.slice(0,-1);
const plur=(w,q)=>q<=1?w:/(tomato|potato|mango)$/.test(w)?w+'es':/s$/.test(w)?w:/(ch|sh|x|z)$/.test(w)?w+'es':/[^aeiou]y$/.test(w)?w.slice(0,-1)+'ies':w+'s';
function parse(line){const s=norm(line.trim()).toLowerCase().replace(/\(.*?\)/g,' ').replace(/^(?:the\s+)?(?:juice|zest)(?:\s+and\s+(?:juice|zest))?\s+of\s+/,'').replace(/,.*$/,'').replace(/\b\d+(?:\.\d+)?-(?:oz|ounces?|g|grams?|lb|inch|in)\b/g,' ').replace(/^(\d+)\s*(?:-|–|to)\s*\d+\s/,'$1 ').replace(/\b(small|medium|large|big|fresh|ripe|freshly)\b/g,'').replace(/\s+/g,' ').trim();
 const p=parseOld(s),w=p.n.split(' ');w[w.length-1]=sing(w[w.length-1]);return{q:p.q,u:UCAN[p.u]||p.u,n:p.n,nk:w.join(' ').trim()}}
function parseOld(line){line=line.trim();const m=line.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)\s*(.*)$/);if(!m)return{q:0,u:'',n:line.toLowerCase()};
let q=m[1].split(/\s+/).reduce((a,x)=>a+(x.includes('/')?x.split('/')[0]/x.split('/')[1]:+x),0);
const w=m[2].split(' ');let u='';const f=w[0].toLowerCase().replace(/s$/,'').replace(/^lb$/,'lb');
if(UNITS.includes(f)){u=f;w.shift()}return{q,u,n:w.join(' ').toLowerCase()}}
const fmt=n=>n?String(Math.round(n*100)/100):'';
const CATS=['Vegetables & Fruit','Spices','Baking','Meat','Dairy & Eggs','Bread','Canned & Pantry','Other'];
const CRE=[[6,/crushed|canned|stock|broth|spaghetti|pasta|noodle|rice\b|oil\b|vinegar|sauce|paste|beans|lentil|coconut|sesame|tahini|miso|chickpea/],[1,/\bsalt\b|cinnamon|cumin|paprika|oregano|nutmeg|black pepper|chili|turmeric|thyme|rosemary|curry|cayenne|spice|masala|garam|seasoning|peppercorn|bay leaf|cardamom|coriander|fennel seed|mustard seed|saffron|sumac|allspice|flakes|garlic powder|onion powder/],[2,/flour|sugar|baking|yeast|cocoa|chocolate|vanilla|oats|cornstarch|honey|syrup|extract/],[5,/\b(bread|buns?|tortillas?|bagels?|rolls?|pita|baguette)\b/],[3,/chicken|beef|pork|bacon|sausage|turkey|lamb|fish|salmon|shrimp|ham\b|steak/],[4,/milk|cream|cheese|cheddar|parmesan|mozzarella|yogurt|butter|\beggs?\b/],[0,/onion|garlic|carrot|celery|tomato|basil|parsley|cilantro|lettuce|spinach|potato|pepper|mushroom|apple|lemon|lime|banana|berr|ginger|cucumber|zucchini|broccoli|cabbage|avocado|scallion|kale|pear|orange|herb|mint|chile|jalape|fresno|serrano|habanero|poblano|shallot|leek|radish|beet|squash|kabocha|pumpkin|dill|chive|sprout|arugula|fennel|cauliflower|corn\b/]];
const catOf=n=>{const h=CRE.find(([i,r])=>r.test(n));return CATS[h?h[0]:7]};
function grocery(){const m={};S.plan.forEach(id=>{const r=byId(id);if(!r)return;r.ing.forEach(l=>{const p=parse(l);const k=p.nk+'|'+p.u;(m[k]=m[k]||{...p,q:0}).q+=p.q*fac(r)})});
return Object.entries(m).map(([k,v])=>{const o=(S.gov&&S.gov[k])||{},q=v.q,cu=PLU.includes(v.u);return{k,text:o.text||[q?nice(q):'',cu?plur(v.u,q):v.u,(!v.u&&q)?plur(v.nk,q):v.n].filter(Boolean).join(' '),cat:o.cat||catOf(v.n)}}).sort((a,b)=>a.text.localeCompare(b.text))}
const card=r=>`<div class="card">${S.view==='recipes'?'<span class="grip" aria-hidden="true" title="Drag to reorder">⠿</span>':''}<button class="open" data-open="${r.id}"><div class="em">${r.em}</div><h3>${esc(r.title)}</h3><small>${r.mins} min · serves ${r.serves}</small></button><button class="btn ${S.plan.includes(r.id)?'':'alt'} sm" data-plan="${r.id}">${S.plan.includes(r.id)?'On the menu ✓':'Add to menu'}</button></div>`;
const fm=m=>m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min';

let curId;
function open(id,keep){const r=byId(id),d=$('#dlg');curId=id;d.dataset.form='';const f=fac(r);
 d.innerHTML=`<div class="row" style="margin-bottom:16px"><button class="btn" data-plan="${r.id}" data-close="1">${S.plan.includes(r.id)?'Remove from menu':'Add to menu'}</button><button class="btn alt" data-edit="${r.id}">Edit</button>${S.ov&&S.ov[r.id]?`<button class="btn alt" data-rso="${r.id}">Restore original</button>`:''}<button class="btn alt" data-del="${r.id}">Delete</button><button class="btn alt" data-close="1">Close</button></div><div style="font-size:3rem">${r.em}</div><h2>${esc(r.title)}</h2><p style="color:var(--soft);margin:4px 0 0">${r.mins} min · <span class="chip">${esc(r.tag)}</span></p><p style="margin:10px 0 0">${stp(r)}</p>
 <h3 style="margin-top:18px">Ingredients</h3><ul>${r.ing.map(i=>`<li>${esc(scaleLine(i,f))}</li>`).join('')}</ul><h3>Method</h3><ol>${r.steps.map(i=>`<li>${esc(annotate(i,r))}</li>`).join('')}</ol>`;
 if(!keep)d.showModal()}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-v],[data-open],[data-plan],[data-del],[data-close],[data-mv],[data-tm],[data-tp],[data-td],[data-new],[data-edit],[data-rso],[data-sall],[data-print],[data-var],[data-wrap],[data-auto],[data-sv],[data-fm],[data-ft],#fbtn,#fclr,#restore,#shuf,#more');if(!t)return;
 if(t.dataset.v){S.view=t.dataset.v;render();window.scrollTo(0,0);return}
 if(t.dataset.tm){const i=t.dataset.tm.lastIndexOf('|');addTimer(t.dataset.tm.slice(0,i),+t.dataset.tm.slice(i+1)*60);return}
 if(t.dataset.tp){const x=timers().find(y=>y.id===t.dataset.tp);if(x){if(x.done){x.done=false;x.left=x.total;x.end=Date.now()+x.total*1000}else if(x.end){x.left=trem(x);x.end=null}else x.end=Date.now()+x.left*1000;save();renderTimers()}return}
 if(t.dataset.td){S.timers=timers().filter(y=>y.id!==t.dataset.td);save();renderTimers();return}
 if(t.dataset.sv){const[id,dl]=t.dataset.sv.split(','),r=byId(id);if(r){S.sv=S.sv||{};const n=dl==='0'?r.serves:Math.min(99,Math.max(1,sv(r)+ +dl));if(n===r.serves)delete S.sv[id];else S.sv[id]=n;save();if($('#dlg').open&&curId===id)open(id,true);render()}return}
 if(t.dataset.fm){S.fm=S.fm===t.dataset.fm?'':t.dataset.fm;save();render();return}
 if(t.dataset.ft){S.ft=S.ft===+t.dataset.ft?0:+t.dataset.ft;save();render();return}
 if(t.id==='fbtn'){S.fo=!S.fo;save();render();return}
 if(t.id==='fclr'){S.fm='';S.ft=0;save();render();return}
 if(t.id==='restore'){S.hidden=[];save();render();return}
 if(t.dataset.var){const ta=$('#s');let pos=ta.selectionStart??ta.value.length,end=ta.selectionEnd??pos;if(!ta.value.trim()){ta.value='1. ';pos=end=3}putText(ta,pos,end,'{'+t.dataset.var+'}');return}
 if(t.dataset.wrap){const[a,b,n]=t.dataset.wrap.split('|');putText($('#s'),+a,+b,'{'+n+'}');$('#vsug').innerHTML='';return}
 if(t.dataset.auto){const ta=$('#s'),ings=$('#i').value.split('\n').map(x=>x.trim()).filter(Boolean);ta.value=ta.value.split('\n').map(l=>{const t2=l.replace(/^\s*\d+[.)]\s*/,'');return l.slice(0,l.length-t2.length)+autoMark(t2,ings)}).join('\n');return}
 if(t.dataset.print){const ds=[...document.querySelectorAll('#app details')];window.__pr=true;ds.forEach(d=>{d.dataset.was=d.open?'1':'0';d.open=true});pf=false;try{window.print()}catch(e){}
  setTimeout(()=>{if(!pf){restoreDetails();const x=$('#toast');x.textContent='Printing isn\u2019t available in this view. Use Ctrl/Cmd+P in your browser.';x.hidden=false;clearTimeout(ring.h);ring.h=setTimeout(()=>{x.hidden=true},8000)}},900);return}
 if(t.dataset.sall){const o=cookPlan().ord;S.so={};if(t.dataset.sall==='1')o.forEach(k=>{S.so[k]=true});save();render();return}
 if(t.dataset.edit){S.editId=t.dataset.edit;S.view='add';render();return}
 if(t.dataset.rso){if(S.ov)delete S.ov[t.dataset.rso];save();if($('#dlg').open&&curId===t.dataset.rso)open(t.dataset.rso,true);render();return}
 if(t.dataset.new){S.editId=null;S.view='add';render();return}
 if(t.id==='more'){S.more=(S.more||0)+1;render();return}
 if(t.id==='shuf'){S.shuffle++;save();render();return}
 if(t.dataset.mv){const[i,dl]=t.dataset.mv.split(',').map(Number),o=cookPlan().ord.slice(),j=i+dl;[o[i],o[j]]=[o[j],o[i]];S.order=o;save();render();return}
 if(t.dataset.open){open(t.dataset.open);return}
 if(t.dataset.plan){const i=S.plan.indexOf(t.dataset.plan);i<0?S.plan.push(t.dataset.plan):S.plan.splice(i,1);save();render()}
 if(t.dataset.del){if(t.dataset.arm!==t.dataset.del){t.dataset.arm=t.dataset.del;t.textContent='Tap again to delete';return}const id=t.dataset.del;S.mine=S.mine.filter(r=>r.id!==id);if(id[0]==='s')S.hidden=[...(S.hidden||[]),id];S.plan=S.plan.filter(x=>x!==id);save();render()}
 if(t.dataset.close||t.dataset.del)$('#dlg').close()});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.chk){S.checked[el.dataset.chk]=el.checked;save();render()}
 else if(el.dataset.gk){S.gov=S.gov||{};const o=S.gov[el.dataset.gk]=S.gov[el.dataset.gk]||{},v=el.value.trim();if(v)o.text=v;else delete o.text;save();render()}
 else if(el.dataset.gc){S.gov=S.gov||{};(S.gov[el.dataset.gc]=S.gov[el.dataset.gc]||{}).cat=el.value;save();render()}});
let D=null,jd=false;
const gridCards=()=>[...document.querySelectorAll('#app .grid .card:not(.blank)')];
document.addEventListener('pointerdown',e=>{if(S.view!=='recipes'||e.button>0)return;const c=e.target.closest('#app .grid .card:not(.blank)');if(!c||e.target.closest('[data-plan]'))return;if(e.pointerType==='touch'&&!e.target.closest('.grip'))return;D={c,x:e.clientX,y:e.clientY,on:false}});
document.addEventListener('pointermove',e=>{if(!D)return;
 if(!D.on){if(Math.hypot(e.clientX-D.x,e.clientY-D.y)<6)return;const r=D.c.getBoundingClientRect();D.on=true;D.ox=D.x-r.left;D.oy=D.y-r.top;D.g=D.c.cloneNode(true);D.g.className='card ghost';D.g.style.width=r.width+'px';document.body.appendChild(D.g);D.c.classList.add('placeholder')}
 D.g.style.left=(e.clientX-D.ox)+'px';D.g.style.top=(e.clientY-D.oy)+'px';
 const el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest('#app .grid .card:not(.blank)');
 if(t&&t!==D.c){const k=gridCards();if(k.indexOf(D.c)>k.indexOf(t))t.before(D.c);else t.after(D.c)}});
const endDrag=()=>{if(!D)return;const d=D;D=null;if(!d.on)return;d.g.remove();d.c.classList.remove('placeholder');
 const ids=gridCards().map(c=>c.querySelector('.open').dataset.open),cur=ordered().map(r=>r.id),slots=[];cur.forEach((id,i)=>{if(ids.includes(id))slots.push(i)});slots.forEach((s,k)=>{cur[s]=ids[k]});S.rorder=cur;save();jd=true;setTimeout(()=>{jd=false},80);render()};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
window.addEventListener('click',e=>{if(jd){e.stopPropagation();e.preventDefault()}},true);
const applyStyle=()=>{if(!['cozy','rustic','garden'].includes(S.style))S.style='cozy';document.documentElement.dataset.style=S.style||'cozy';$('#stylesel').value=S.style||'cozy'};applyStyle();
$('#stylesel').addEventListener('change',e=>{S.style=e.target.value;save();applyStyle()});
let pf=false;
const restoreDetails=()=>{document.querySelectorAll('#app details[data-was]').forEach(d=>{d.open=d.dataset.was==='1';delete d.dataset.was});setTimeout(()=>{window.__pr=false},150)};
window.addEventListener('beforeprint',()=>{pf=true});window.addEventListener('afterprint',restoreDetails);
document.addEventListener('toggle',e=>{if(window.__pr)return;const d=e.target;if(d.dataset&&d.dataset.sk){S.so=S.so||{};if(d.open)S.so[d.dataset.sk]=true;else delete S.so[d.dataset.sk];save()}},true);
const dlgEl=$('#dlg');let dOut=false;const outsideDlg=e=>{const r=dlgEl.getBoundingClientRect();return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom};
dlgEl.addEventListener('pointerdown',e=>{dOut=outsideDlg(e)});
dlgEl.addEventListener('click',e=>{if(dOut&&outsideDlg(e)&&!dlgEl.dataset.form)dlgEl.close();dOut=false});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.view==='today')render()});
render();
</script>
</body>
</html>
